- doc: Test for multi-sample-binning (Binette only)
  job:
    Paired-end reads:
      class: Collection
      collection_type: list:paired
      elements:
      - class: Collection
        type: paired
        identifier: Mock1
        elements:
        - class: File
          identifier: forward
          location: https://zenodo.org/records/22982485/files/Mock1_R1.fastq.gz
        - class: File
          identifier: reverse
          location: https://zenodo.org/records/22982485/files/Mock1_R2.fastq.gz
      - class: Collection
        type: paired
        identifier: Mock2
        elements:
        - class: File
          identifier: forward
          location: https://zenodo.org/records/22982485/files/Mock2_R1.fastq.gz
        - class: File
          identifier: reverse
          location: https://zenodo.org/records/22982485/files/Mock2_R2.fastq.gz
      - class: Collection
        type: paired
        identifier: Mock3
        elements:
        - class: File
          identifier: forward
          location: https://zenodo.org/records/22982485/files/Mock3_R1.fastq.gz
        - class: File
          identifier: reverse
          location: https://zenodo.org/records/22982485/files/Mock3_R2.fastq.gz
      - class: Collection
        type: paired
        identifier: Mock4
        elements:
        - class: File
          identifier: forward
          location: https://zenodo.org/records/22982485/files/Mock4_R1.fastq.gz
        - class: File
          identifier: reverse
          location: https://zenodo.org/records/22982485/files/Mock4_R2.fastq.gz
      - class: Collection
        type: paired
        identifier: Mock5
        elements:
        - class: File
          identifier: forward
          location: https://zenodo.org/records/22982485/files/Mock5_R1.fastq.gz
        - class: File
          identifier: reverse
          location: https://zenodo.org/records/22982485/files/Mock5_R2.fastq.gz
    Assemblies:
      class: Collection
      collection_type: list
      elements:
      - class: File
        identifier: Mock1
        location: https://zenodo.org/records/22982485/files/Mock1.fasta
      - class: File
        identifier: Mock2
        location: https://zenodo.org/records/22982485/files/Mock2.fasta
      - class: File
        identifier: Mock3
        location: https://zenodo.org/records/22982485/files/Mock3.fasta
      - class: File
        identifier: Mock4
        location: https://zenodo.org/records/22982485/files/Mock4.fasta
      - class: File
        identifier: Mock5
        location: https://zenodo.org/records/22982485/files/Mock5.fasta
    Run COMEBin?: true
    Read length (CONCOCT): 100
    Bin refinement tool: Binette
    CheckM2 Database: 1.0.2
  outputs:
    SemiBin bins:
      element_tests:
        Mock4:
          elements:
            SemiBin_0:
              asserts:
                - has_text:
                    text: '>k141_1375'
                - has_text:
                    text: '>k141_279'
        Mock5:
          elements:
            SemiBin_0:
              asserts:
                - has_text:
                    text: '>k141_1121'
                - has_text:
                    text: '>k141_422'
    MetaBAT2 bins:
      element_tests:
        Mock4:
          elements:
            '1':
              asserts:
                - has_text:
                    text: '>k141_1646'
                - has_text:
                    text: '>k141_2194'
        Mock5:
          elements:
            '1':
              asserts:
                - has_text:
                    text: '>k141_287'
                - has_text:
                    text: '>k141_1121'
    MaxBin2 bins:
      element_tests:
        Mock4:
          elements:
            '001':
              asserts:
                - has_text:
                    text: '>k141_274'
                - has_text:
                    text: '>k141_549'
        test_minigut:
          Mock5:
            '001':
              asserts:
                - has_text:
                    text: '>k141_282'
                - has_text:
                    text: '>k141_1261'
    CONCOCT bins:
      element_tests:
        Mock4:
          elements:
            '0':
              asserts:
                - has_text:
                    text: '>k141_2557'
                - has_text:
                    text: 'len=1277'
        Mock5:
          elements:
            '0':
              asserts:
                - has_text:
                    text: '>k141_287'
                - has_text:
                    text: '>k141_1095'
    Binette bins:
      element_tests:
        Mock4:
          elements:
            binette_bin1:
              asserts:
                - has_text:
                    text: '>k141_2466'
                - has_text:
                    text: '>k141_1375'
        Mock5:
          elements:
            binette_bin1:
              asserts:
                - has_text:
                    text: '>k141_7'
                - has_text:
                    text: '>k141_701'
    COMEBin bins:
      element_tests:
        Mock4:
          elements:
            0.fa:
              asserts:
                - has_text:
                    text: '>k141_1005'
                - has_text:
                    text: '>k141_1927'
        Mock5:
          elements:
            0.fa:
              asserts:
                - has_text:
                    text: '>k141_7'
                - has_text:
                    text: '>k141_701'
    Binette pre quality reports:
      element_tests:
        Mock4:
          elements:
            input_bins_1.bin_table_0:
              asserts:
                - has_n_lines:
                    n: 18
                    delta: 2
        Mock5:
          elements:
            input_bins_1.bin_table_0:
              asserts:
                - has_n_lines:
                    n: 64
                    delta: 2
    Binette post quality reports:
      element_tests:
        Mock4:
          asserts:
            - has_n_lines:
                n: 4
                delta: 1
        Mock5:
          asserts:
            - has_n_lines:
                n: 5
                delta: 1
